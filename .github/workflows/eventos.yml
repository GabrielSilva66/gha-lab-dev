name: Workflow 2


on:
  push:
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      nome:
        type: choice
        default: "turma"
        required: true
        options:
          - "Fulano"
          - "cilano"
          - "beltrano"        
          - "turma"

jobs:
  comprimentar:
    runs-on: ubuntu-latest
    env:
      NOME: inputs.nome

    steps:
      - name: comprimentar
        run: echo "Opa, como vai $NOME"
  
