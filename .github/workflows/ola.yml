name: Workflow 1

on:
  push:
  workflow_dispatch:

jobs:
  saudacao:
    runs-on: ubuntu-latest

    steps:
      - name: Comprimenta
        run: |
          echo "Opa, ${{github.actor}}"
          echo "Evento: ${{github.event_name}}"

      - name: SO e versao python
        run: |
          echo "SO runner: $RUNNER_OS"
          uname -a
          python --version
          ls -la

      - name: Contexto github em JSON
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: |
          echo "$GITHUB_CONTEXT"
          echo "SHA do commit: $(echo "$GITHUB_CONTEXT" | jq -r '.sha')"
          echo "Nome do evento: $(echo "$GITHUB_CONTEXT" | jq -r '.event_name')"
